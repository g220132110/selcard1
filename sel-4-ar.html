<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SEL 卡片 4 ─ 兩條路的十字路口（動畫版）</title>

  <!-- MindAR + ThreeJS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.3/dist/mindar-image-three.prod.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
    }
    #mindar-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #messageBox, #questionBox {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      opacity: 0;
      transition: opacity 0.4s;
      text-align: center;
      z-index: 999;
      width: 80%;
      max-width: 430px;
      line-height: 1.5;
    }
    #messageBox { top: 10vh; }
    #questionBox { bottom: 8vh; font-size: 0.95rem; }

    /* 進場動畫（淡入＋上浮） */
    @keyframes appearUp {
      0%   { opacity: 0; transform: translateY(0.2); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div id="mindar-container"></div>

  <!-- 上方訊息 -->
  <div id="messageBox"></div>

  <!-- 下方反思 -->
  <div id="questionBox">
    <b>思考引導：</b><br><br>
    ● 最近讓你卡住的選擇是什麼？<br>
    ● 做決定時，你最在乎的是誰的期待？<br>
    ● 如果「不會失敗」，你會選哪一條路？
  </div>

  <script type="module">
    const messageBox = document.getElementById("messageBox");
    const questionBox = document.getElementById("questionBox");

    const choiceMessages = [
      "成績／學習：辛苦，但會累積你的實力。",
      "手機娛樂：能讓你放鬆，但要小心被時間偷走。",
      "朋友：陪伴重要，但選擇依然要忠於自己。",
      "價值／初心：真正想守護的，未必被大家理解。",
      "安全圈：舒服安穩，但可能離夢想更遠。",
      "夢想：不確定，但最貼近真正的你。"
    ];

    let clickCount = 0;

    function showMessage(text) {
      messageBox.innerText = text;
      messageBox.style.opacity = 1;
      setTimeout(() => { messageBox.style.opacity = 0; }, 2800);
    }

    function tryShowQuestions() {
      if (clickCount >= 3) {
        questionBox.style.opacity = 1;
      }
    }

    // ----------------------- 啟動 AR -----------------------
    const startAR = async () => {
      const mindarThree = new window.MINDAR.IMAGE.MindARThree({
        container: document.querySelector("#mindar-container"),
        imageTargetSrc: "targets-4.mind",
      });

      const { renderer, scene, camera } = mindarThree;
      const anchor = mindarThree.addAnchor(0);

      // 光源
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
      scene.add(light);

      // 六個泡泡
      const bubbles = [];
      const geo = new THREE.SphereGeometry(0.18, 32, 32);
      const baseMat = new THREE.MeshStandardMaterial({
        transparent: true,
        opacity: 0
      });

      const positions = [
        [-0.6,  0.25],
        [ 0.6,  0.25],
        [-0.6, -0.2],
        [ 0.6, -0.2],
        [-0.2,  0.05],
        [ 0.2,  0.05],
      ];

      const colors = [
        0xffc966, 0x66bbff, 0xff7777,
        0x99dd99, 0xcccccc, 0xffee66
      ];

      for (let i = 0; i < 6; i++) {
        const bubble = new THREE.Mesh(geo, baseMat.clone());
        bubble.position.set(positions[i][0], positions[i][1], 0);
        bubble.material.color.setHex(colors[i]);
        bubble.userData.index = i;

        anchor.group.add(bubble);
        bubbles.push(bubble);
      }

      // 進場動畫：依序淡入
      bubbles.forEach((b, i) => {
        setTimeout(() => {
          b.material.opacity = 0.6;
        }, i * 350);
      });

      // 點擊偵測
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener("click", (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const hit = raycaster.intersectObjects(bubbles);

        if (hit.length > 0) {
          const obj = hit[0].object;
          const idx = obj.userData.index;

          // 顯示訊息
          showMessage(choiceMessages[idx]);

          // 點擊動畫：放大 → 縮小 → 淡出
          obj.scale.set(1.3, 1.3, 1.3);

          setTimeout(() => {
            obj.scale.set(0.5, 0.5, 0.5);
            obj.material.opacity = 0;
          }, 180);

          clickCount++;
          tryShowQuestions();
        }
      });

      // 動畫 loop
      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        bubbles.forEach((b, i) => {
          b.position.y += Math.sin(Date.now() * 0.001 + i) * 0.00045;
        });
        renderer.render(scene, camera);
      });
    };

    startAR();
  </script>
</body>
</html>
