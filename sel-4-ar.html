<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SEL 卡片 4 ─ 兩條路的十字路口</title>

  <!-- MindAR + ThreeJS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.3/dist/mindar-image-three.prod.js"></script>

  <style>
    body, html {
      padding: 0;
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
    }
    #mindar-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #messageBox, #questionBox {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 999;
      width: 80%;
      max-width: 430px;
      line-height: 1.5;
    }
    #messageBox { top: 10vh; }
    #questionBox { bottom: 8vh; font-size: 0.95rem; }
  </style>
</head>

<body>
  <div id="mindar-container"></div>

  <!-- 彈出訊息 -->
  <div id="messageBox"></div>

  <!-- 思考引導 -->
  <div id="questionBox">
    <b>思考引導：</b><br><br>
    ● 最近讓你卡住的選擇是什麼？<br>
    ● 做決定時，你最在乎的是誰的期待？<br>
    ● 如果「不會失敗」，你其實最想走哪條路？
  </div>

  <script type="module">
    const messageBox = document.getElementById("messageBox");
    const questionBox = document.getElementById("questionBox");

    // 六種「選擇泡泡」訊息
    const choiceMessages = [
      "成績／學習：辛苦，但能慢慢累積你的實力。",
      "手機娛樂：能讓你放鬆，但要小心被時間偷走。",
      "人際關係：朋友會影響你，但你依然可以做自己的選擇。",
      "價值／初心：你真正想守護的，不一定會被別人理解。",
      "休息／舒適圈：舒服安全，但可能離夢想更遠。",
      "夢想：也許不確定，但最貼近真正的你。"
    ];

    let clickCount = 0;

    function showMessage(text) {
      messageBox.innerText = text;
      messageBox.style.opacity = 1;

      setTimeout(() => {
        messageBox.style.opacity = 0;
      }, 2900);
    }

    function tryShowQuestions() {
      if (clickCount >= 3) {
        questionBox.style.opacity = 1;
      }
    }

    // 啟動 AR
    const startAR = async () => {
      const mindarThree = new window.MINDAR.IMAGE.MindARThree({
        container: document.querySelector("#mindar-container"),
        imageTargetSrc: "targets-4.mind",
      });

      const { renderer, scene, camera } = mindarThree;

      const anchor = mindarThree.addAnchor(0);

      // Light
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.1);
      scene.add(light);

      // 六種選擇泡泡
      const choices = [];
      const geometry = new THREE.SphereGeometry(0.18, 32, 32);

      const baseMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.55,
      });

      // 六顆泡泡位置（左右分散）
      const positions = [
        [-0.6,  0.2],   // 成績 / 書本
        [ 0.6,  0.2],   // 手機
        [-0.6, -0.2],   // 朋友
        [ 0.6, -0.2],   // 價值
        [-0.2,  0.0],   // 休息
        [ 0.2,  0.0],   // 夢想
      ];

      for (let i = 0; i < 6; i++) {
        const bubble = new THREE.Mesh(geometry, baseMaterial.clone());

        bubble.position.set(positions[i][0], positions[i][1], 0);
        bubble.userData.index = i;

        // 上色區分
        const colors = [0xffcc66, 0x66bbff, 0xff7777, 0x99dd99, 0xcccccc, 0xffee66];
        bubble.material.color.setHex(colors[i]);

        anchor.group.add(bubble);
        choices.push(bubble);
      }

      // 點擊偵測
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener("click", (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(choices);

        if (intersects.length > 0) {
          const obj = intersects[0].object;
          const idx = obj.userData.index;

          showMessage(choiceMessages[idx]);

          // 泡泡淡出
          obj.material.opacity = 0;

          clickCount++;
          tryShowQuestions();
        }
      });

      // 動畫 loop
      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        // 飄動動畫
        choices.forEach((c, i) => {
          c.position.y += Math.sin(Date.now() * 0.001 + i) * 0.00045;
        });

        renderer.render(scene, camera);
      });
    };

    startAR();
  </script>
</body>
</html>
