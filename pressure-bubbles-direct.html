<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>被看不見的壓力球 - 直接體驗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans TC', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            position: relative;
            background: white;
        }
        #illustration {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.3s ease;
            animation: float 3s ease-in-out infinite;
            box-shadow: 
                inset -10px -10px 20px rgba(255, 255, 255, 0.5),
                inset 10px 10px 20px rgba(0, 0, 0, 0.1),
                0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .bubble:hover {
            transform: scale(1.1);
        }
        .bubble::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 30%;
            height: 30%;
            background: radial-gradient(circle, rgba(255,255,255,0.8), transparent);
            border-radius: 50%;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            25% { transform: translateY(-15px) translateX(5px); }
            50% { transform: translateY(-10px) translateX(-5px); }
            75% { transform: translateY(-20px) translateX(3px); }
        }
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: scale(0);
            }
            to { 
                opacity: 1; 
                transform: scale(1);
            }
        }
        .bubble.appear {
            animation: fadeIn 0.6s ease-out, float 3s ease-in-out infinite 0.6s;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 25px 35px;
            border-radius: 20px;
            font-size: 20px;
            z-index: 100;
            text-align: center;
            display: none;
            line-height: 1.6;
        }
        #message.show {
            display: block;
            animation: messageIn 0.5s ease-out;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        #finalQuestion {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px 30px;
            border-radius: 25px;
            font-size: 18px;
            z-index: 100;
            text-align: center;
            max-width: 85%;
            display: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        #finalQuestion.show {
            display: block;
            animation: slideUp 0.8s ease-out;
        }
        @keyframes slideUp {
            from { transform: translate(-50%, 100px); opacity: 0; }
            to { transform: translateX(-50%); opacity: 1; }
        }
        #counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(167,139,250,0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            z-index: 100;
        }
        #title {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            z-index: 100;
        }
        #instruction {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 99;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="title">💭 被看不見的壓力球</div>
    <div id="counter">剩餘: <span id="count">5</span></div>
    <div id="instruction">👆 點擊漂浮的壓力球</div>

    <div id="container">
        <!-- 插畫圖片 -->
        <img id="illustration" src="./illustration.png" alt="情緒覺察插畫" onerror="this.style.display='none'; document.getElementById('noImage').style.display='block';">
        
        <!-- 如果沒有圖片，顯示這個 -->
        <div id="noImage" style="display:none; width:100%; height:100%; background: linear-gradient(135deg, #fef3c7, #fde68a); display:flex; align-items:center; justify-content:center; font-size:24px; color:#78350f; text-align:center; padding:40px;">
            📷<br>請上傳 illustration.png<br>或直接使用 AR 版本
        </div>

        <!-- Canvas 用來繪製氣泡 -->
        <canvas id="canvas"></canvas>
    </div>

    <div id="message"></div>
    <div id="finalQuestion">💭 你的壓力來源是什麼？</div>

    <script>
        console.log('💭 情緒覺察：被看不見的壓力球 (直接體驗版)');

        const container = document.getElementById('container');
        const canvas = document.getElementById('canvas');
        const message = document.getElementById('message');
        const finalQuestion = document.getElementById('finalQuestion');
        const countSpan = document.getElementById('count');
        const instruction = document.getElementById('instruction');

        // 設定 canvas 大小
        function resizeCanvas() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 狀態
        let bubblesPopped = 0;
        const totalBubbles = 5;
        const bubbles = [];

        // 鼓勵訊息
        const messages = [
            '這是壓力，不是你不夠努力 💜',
            '你已經做得很好了 🌟',
            '這份壓力不該由你承擔 🤗',
            '你值得被溫柔對待 💝',
            '放下不屬於你的重擔 🕊️'
        ];

        // 氣泡配置
        const bubbleConfigs = [
            { size: 80, x: 70, y: 25, color: 'rgba(192, 132, 252, 0.6)', delay: 0 },
            { size: 60, x: 20, y: 35, color: 'rgba(167, 139, 250, 0.6)', delay: 800 },
            { size: 90, x: 50, y: 15, color: 'rgba(139, 92, 246, 0.6)', delay: 1600 },
            { size: 70, x: 15, y: 55, color: 'rgba(124, 58, 237, 0.6)', delay: 2400 },
            { size: 75, x: 75, y: 45, color: 'rgba(109, 40, 217, 0.6)', delay: 3200 }
        ];

        // 創建氣泡
        function createBubble(config, index) {
            setTimeout(() => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble appear';
                bubble.style.width = config.size + 'px';
                bubble.style.height = config.size + 'px';
                bubble.style.left = config.x + '%';
                bubble.style.top = config.y + '%';
                bubble.style.background = config.color;
                bubble.style.animationDelay = (index * 0.3) + 's';
                
                bubble.dataset.index = index;
                
                bubble.addEventListener('click', (e) => {
                    popBubble(bubble, index, e);
                });

                canvas.appendChild(bubble);
                bubbles.push(bubble);
            }, config.delay);
        }

        // 開始創建氣泡
        bubbleConfigs.forEach((config, index) => {
            createBubble(config, index);
        });

        // 氣泡破裂
        function popBubble(bubble, index, event) {
            if (bubble.classList.contains('popped')) return;
            
            console.log(`💥 氣泡 ${index + 1} 被點擊`);
            bubble.classList.add('popped');
            bubblesPopped++;
            countSpan.textContent = totalBubbles - bubblesPopped;

            // 破裂動畫
            bubble.style.animation = 'pop 0.4s ease-out';
            
            // 創建粒子
            createParticles(event.clientX, event.clientY, bubble.style.background);

            // 顯示訊息
            setTimeout(() => {
                showMessage(messages[index]);
            }, 200);

            // 移除氣泡
            setTimeout(() => {
                bubble.remove();
            }, 400);

            // 檢查是否全部完成
            if (bubblesPopped === totalBubbles) {
                setTimeout(() => {
                    showFinalQuestion();
                }, 2000);
            }
        }

        // 創建粒子效果
        function createParticles(x, y, color) {
            const particleCount = 12;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.background = color;
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = (Math.PI * 2 * i) / particleCount;
                const distance = 50 + Math.random() * 50;
                const duration = 400 + Math.random() * 200;
                
                document.body.appendChild(particle);
                
                // 動畫
                const targetX = x + Math.cos(angle) * distance;
                const targetY = y + Math.sin(angle) * distance;
                
                particle.animate([
                    { 
                        transform: 'translate(0, 0) scale(1)',
                        opacity: 1
                    },
                    { 
                        transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0)`,
                        opacity: 0
                    }
                ], {
                    duration: duration,
                    easing: 'ease-out'
                });

                setTimeout(() => {
                    particle.remove();
                }, duration);
            }
        }

        // 顯示訊息
        function showMessage(text) {
            message.textContent = text;
            message.classList.add('show');

            setTimeout(() => {
                message.classList.remove('show');
            }, 2500);
        }

        // 顯示最終問題
        function showFinalQuestion() {
            console.log('✨ 所有氣泡已破裂');
            instruction.textContent = '✨ 你做到了！';
            instruction.style.background = 'rgba(167,139,250,0.9)';
            document.getElementById('counter').style.display = 'none';
            finalQuestion.classList.add('show');
        }

        console.log('========================================');
        console.log('💭 直接體驗版本');
        console.log('🎯 點擊所有壓力球');
        console.log('========================================');
    </script>
</body>
</html>
