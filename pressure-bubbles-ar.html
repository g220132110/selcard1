<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>被看不見的壓力球 - AR體驗</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Noto Sans TC', Arial, sans-serif;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        #loading.hide {
            display: none;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #instructions {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(167,139,250,0.95);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 16px;
            z-index: 999;
            text-align: center;
            max-width: 85%;
        }
        #instructions.hide {
            display: none;
        }
        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 25px 35px;
            border-radius: 20px;
            font-size: 18px;
            z-index: 998;
            text-align: center;
            max-width: 80%;
            display: none;
            line-height: 1.6;
        }
        #message.show {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        #finalQuestion {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px 30px;
            border-radius: 25px;
            font-size: 17px;
            z-index: 997;
            text-align: center;
            max-width: 85%;
            display: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        #finalQuestion.show {
            display: block;
            animation: slideUp 0.8s ease-out;
        }
        @keyframes slideUp {
            from { transform: translate(-50%, 100px); opacity: 0; }
            to { transform: translateX(-50%); opacity: 1; }
        }
        #status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 996;
        }
        #bubbleCount {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(167,139,250,0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            z-index: 995;
            display: none;
        }
        #bubbleCount.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- 載入畫面 -->
    <div id="loading">
        <div style="font-size: 50px; margin-bottom: 20px;">💭</div>
        <div class="loader"></div>
        <div style="margin-top: 20px; font-size: 18px;">被看不見的壓力球</div>
        <div style="margin-top: 10px; font-size: 14px; opacity: 0.8;">情緒覺察體驗</div>
    </div>

    <!-- 使用說明 -->
    <div id="instructions">
        📷 將相機對準插畫圖片<br>
        <small>點擊漂浮的壓力球</small>
    </div>

    <!-- 狀態顯示 -->
    <div id="status">等待掃描...</div>

    <!-- 氣泡計數 -->
    <div id="bubbleCount">剩餘氣泡: <span id="count">5</span></div>

    <!-- 訊息提示 -->
    <div id="message"></div>

    <!-- 最終問題 -->
    <div id="finalQuestion">
        💭 你的壓力來源是什麼？
    </div>

    <!-- AR 場景 -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
        color-space="sRGB" 
        renderer="colorManagement: true; antialias: true; alpha: true;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- AR 內容 -->
        <a-entity id="target" mindar-image-target="targetIndex: 0">
            
            <!-- 插畫圖片（如果需要） -->
            <a-image 
                id="illustration"
                src="./illustration.png"
                position="0 0 -0.1"
                width="2"
                height="2.5"
                opacity="0"
                visible="false">
            </a-image>

            <!-- 壓力氣泡們 -->
            <!-- 氣泡 1 -->
            <a-entity id="bubble1" class="bubble" visible="false">
                <a-sphere 
                    radius="0.15" 
                    color="#c084fc" 
                    opacity="0.6"
                    position="0.6 0.8 0.3"
                    class="clickable">
                </a-sphere>
                <a-sphere 
                    radius="0.16" 
                    color="#ffffff" 
                    opacity="0.1"
                    position="0.6 0.8 0.3">
                </a-sphere>
            </a-entity>

            <!-- 氣泡 2 -->
            <a-entity id="bubble2" class="bubble" visible="false">
                <a-sphere 
                    radius="0.12" 
                    color="#a78bfa" 
                    opacity="0.6"
                    position="-0.5 0.6 0.4"
                    class="clickable">
                </a-sphere>
                <a-sphere 
                    radius="0.13" 
                    color="#ffffff" 
                    opacity="0.1"
                    position="-0.5 0.6 0.4">
                </a-sphere>
            </a-entity>

            <!-- 氣泡 3 -->
            <a-entity id="bubble3" class="bubble" visible="false">
                <a-sphere 
                    radius="0.18" 
                    color="#8b5cf6" 
                    opacity="0.6"
                    position="0.2 1.0 0.2"
                    class="clickable">
                </a-sphere>
                <a-sphere 
                    radius="0.19" 
                    color="#ffffff" 
                    opacity="0.1"
                    position="0.2 1.0 0.2">
                </a-sphere>
            </a-entity>

            <!-- 氣泡 4 -->
            <a-entity id="bubble4" class="bubble" visible="false">
                <a-sphere 
                    radius="0.14" 
                    color="#7c3aed" 
                    opacity="0.6"
                    position="-0.7 0.9 0.35"
                    class="clickable">
                </a-sphere>
                <a-sphere 
                    radius="0.15" 
                    color="#ffffff" 
                    opacity="0.1"
                    position="-0.7 0.9 0.35">
                </a-sphere>
            </a-entity>

            <!-- 氣泡 5 -->
            <a-entity id="bubble5" class="bubble" visible="false">
                <a-sphere 
                    radius="0.16" 
                    color="#6d28d9" 
                    opacity="0.6"
                    position="0.4 0.5 0.25"
                    class="clickable">
                </a-sphere>
                <a-sphere 
                    radius="0.17" 
                    color="#ffffff" 
                    opacity="0.1"
                    position="0.4 0.5 0.25">
                </a-sphere>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        console.log('💭 情緒覺察：被看不見的壓力球');

        // 元素
        const loading = document.getElementById('loading');
        const instructions = document.getElementById('instructions');
        const status = document.getElementById('status');
        const message = document.getElementById('message');
        const finalQuestion = document.getElementById('finalQuestion');
        const bubbleCount = document.getElementById('bubbleCount');
        const countSpan = document.getElementById('count');
        const scene = document.querySelector('a-scene');
        const target = document.getElementById('target');

        // 狀態
        let isTargetFound = false;
        let bubblesPopped = 0;
        let totalBubbles = 5;
        let animationStarted = false;

        // 鼓勵訊息
        const messages = [
            '這是壓力，不是你不夠努力 💜',
            '你已經做得很好了 🌟',
            '這份壓力不該由你承擔 🤗',
            '你值得被溫柔對待 💝',
            '放下不屬於你的重擔 🕊️'
        ];

        // 場景載入
        scene.addEventListener('loaded', () => {
            console.log('✓ 場景載入完成');
            setTimeout(() => {
                loading.classList.add('hide');
            }, 1000);
        });

        // 找到特徵圖
        target.addEventListener('targetFound', () => {
            console.log('✓ 找到插畫！');
            isTargetFound = true;
            status.textContent = '✓ 開始體驗';
            status.style.background = 'rgba(0,200,0,0.7)';
            instructions.classList.add('hide');
            bubbleCount.classList.add('show');

            // 開始氣泡動畫
            if (!animationStarted) {
                animationStarted = true;
                startBubbleAnimation();
            }
        });

        // 失去特徵圖
        target.addEventListener('targetLost', () => {
            console.log('✗ 失去插畫');
            isTargetFound = false;
            status.textContent = '請對準插畫';
            status.style.background = 'rgba(0,0,0,0.7)';
        });

        // 開始氣泡動畫
        function startBubbleAnimation() {
            console.log('🎈 氣泡開始出現');

            // 依序顯示氣泡
            for (let i = 1; i <= totalBubbles; i++) {
                setTimeout(() => {
                    showBubble(i);
                }, i * 800); // 每個氣泡間隔 0.8 秒
            }
        }

        // 顯示單個氣泡
        function showBubble(index) {
            const bubble = document.getElementById(`bubble${index}`);
            if (!bubble) return;

            bubble.setAttribute('visible', 'true');
            
            // 淡入效果
            const spheres = bubble.querySelectorAll('a-sphere');
            spheres.forEach(sphere => {
                sphere.setAttribute('animation', {
                    property: 'scale',
                    from: '0 0 0',
                    to: '1 1 1',
                    dur: 600,
                    easing: 'easeOutElastic'
                });
            });

            // 漂浮動畫
            const mainSphere = spheres[0];
            const currentPos = mainSphere.getAttribute('position');
            mainSphere.setAttribute('animation__float', {
                property: 'position',
                to: `${currentPos.x} ${currentPos.y + 0.15} ${currentPos.z}`,
                dur: 2000 + Math.random() * 1000,
                loop: true,
                dir: 'alternate',
                easing: 'easeInOutQuad'
            });

            // 旋轉動畫
            mainSphere.setAttribute('animation__rotate', {
                property: 'rotation',
                to: '0 360 0',
                dur: 8000 + Math.random() * 4000,
                loop: true,
                easing: 'linear'
            });

            // 點擊事件
            mainSphere.addEventListener('click', () => {
                popBubble(index, mainSphere);
            });
        }

        // 氣泡破裂
        function popBubble(index, sphere) {
            console.log(`💥 氣泡 ${index} 被點擊`);
            
            const bubble = document.getElementById(`bubble${index}`);
            if (!bubble || !bubble.getAttribute('visible')) return;

            bubblesPopped++;
            countSpan.textContent = totalBubbles - bubblesPopped;

            // 破裂動畫
            sphere.setAttribute('animation__pop', {
                property: 'scale',
                to: '2 2 2',
                dur: 300,
                easing: 'easeOutQuad'
            });

            sphere.setAttribute('animation__fade', {
                property: 'opacity',
                to: '0',
                dur: 300
            });

            // 粒子效果
            createParticles(sphere.getAttribute('position'));

            // 顯示鼓勵訊息
            setTimeout(() => {
                showMessage(messages[index - 1]);
            }, 200);

            // 隱藏氣泡
            setTimeout(() => {
                bubble.setAttribute('visible', 'false');
            }, 400);

            // 檢查是否全部破完
            if (bubblesPopped === totalBubbles) {
                setTimeout(() => {
                    showFinalQuestion();
                }, 2000);
            }
        }

        // 創建破裂粒子
        function createParticles(position) {
            const colors = ['#c084fc', '#a78bfa', '#8b5cf6'];
            
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('a-sphere');
                particle.setAttribute('radius', '0.03');
                particle.setAttribute('color', colors[Math.floor(Math.random() * colors.length)]);
                particle.setAttribute('position', position);
                
                const angle = (Math.PI * 2 * i) / 8;
                const distance = 0.3;
                const targetPos = {
                    x: position.x + Math.cos(angle) * distance,
                    y: position.y + Math.sin(angle) * distance,
                    z: position.z
                };

                particle.setAttribute('animation', {
                    property: 'position',
                    to: `${targetPos.x} ${targetPos.y} ${targetPos.z}`,
                    dur: 500,
                    easing: 'easeOutQuad'
                });

                particle.setAttribute('animation__fade', {
                    property: 'opacity',
                    from: '1',
                    to: '0',
                    dur: 500
                });

                target.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 600);
            }
        }

        // 顯示訊息
        function showMessage(text) {
            message.textContent = text;
            message.classList.add('show');

            setTimeout(() => {
                message.classList.remove('show');
            }, 2500);
        }

        // 顯示最終問題
        function showFinalQuestion() {
            console.log('✨ 所有氣泡已破裂');
            bubbleCount.style.display = 'none';
            status.textContent = '✨ 你做到了！';
            status.style.background = 'rgba(167,139,250,0.9)';
            finalQuestion.classList.add('show');
        }

        // 檢查檔案
        fetch('./targets.mind')
            .then(res => {
                if (res.ok) {
                    console.log('✓ targets.mind 存在');
                } else {
                    throw new Error('找不到檔案');
                }
            })
            .catch(err => {
                console.error('❌ 找不到 targets.mind');
                alert('找不到特徵圖檔案！\n請確認 targets.mind 已上傳。');
            });

        console.log('========================================');
        console.log('💭 情緒覺察：被看不見的壓力球');
        console.log('🎯 體驗目標：點擊所有壓力球');
        console.log('========================================');
    </script>
</body>
</html>
