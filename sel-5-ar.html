<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>SEL 卡片 5 ─ 黑夜裡的小燈塔</title>

  <!-- MindAR + ThreeJS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.3/dist/mindar-image-three.prod.js"></script>

  <style>
    body, html {
      padding: 0;
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
    }
    #mindar-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #messageBox, #questionBox {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      opacity: 0;
      transition: opacity 0.4s;
      text-align: center;
      z-index: 999;
      width: 80%;
      max-width: 430px;
      line-height: 1.5;
    }
    #messageBox { top: 10vh; }
    #questionBox { bottom: 8vh; font-size: 0.95rem; }
  </style>
</head>

<body>
  <div id="mindar-container"></div>

  <!-- 彈出訊息 -->
  <div id="messageBox"></div>

  <!-- 思考引導 -->
  <div id="questionBox">
    <b>思考引導：</b><br><br>
    ● 最近一次，你「差點說出口」但最後還是忍住的求助是什麼？<br>
    ● 在你的生活中，誰可以成為你的「小燈塔」？<br>
    ● 如果再遇到困難，你想對誰說第一句話？
  </div>

  <script type="module">
    const messageBox = document.getElementById("messageBox");
    const questionBox = document.getElementById("questionBox");

    // 六個支持泡泡
    const supportMessages = [
      "師長：他們其實願意聽你說，只是你還沒開口。",
      "朋友：真正的朋友不會嫌你麻煩，他們會希望你過得好。",
      "家人：他們可能不完美，但多半希望你平安。",
      "諮商：尋求專業不是軟弱，而是成熟的選擇。",
      "善意：世界上總有人願意伸手，只是你還沒遇見。",
      "勇氣：當你願意說出第一句話，光就會開始亮起來。"
    ];

    let clickCount = 0;

    function showMessage(text) {
      messageBox.innerText = text;
      messageBox.style.opacity = 1;
      setTimeout(() => { messageBox.style.opacity = 0; }, 2900);
    }

    function tryShowQuestions() {
      if (clickCount >= 3) {
        questionBox.style.opacity = 1;
      }
    }

    // 啟動 AR
    const startAR = async () => {
      const mindarThree = new window.MINDAR.IMAGE.MindARThree({
        container: document.querySelector("#mindar-container"),
        imageTargetSrc: "targets-5.mind",
      });

      const { renderer, scene, camera } = mindarThree;
      const anchor = mindarThree.addAnchor(0);

      // Light
      const light = new THREE.HemisphereLight(0xffffff, 0x222233, 1.1);
      scene.add(light);

      // 六顆泡泡
      const bubbles = [];
      const geo = new THREE.SphereGeometry(0.18, 32, 32);
      const baseMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.55
      });

      // 位置配置（以燈塔畫面為基準）
      const positions = [
        [-0.6,  0.25],  // 師長
        [ 0.6,  0.25],  // 朋友
        [-0.6, -0.15],  // 家人
        [ 0.6, -0.15],  // 諮商
        [-0.2,  0.05],  // 善意
        [ 0.2,  0.05],  // 勇氣
      ];

      // 配色區分
      const colors = [0xffee88, 0x88ccff, 0xffaaaa, 0xaaffaa, 0xffffff, 0xffdd66];

      for (let i = 0; i < 6; i++) {
        const bubble = new THREE.Mesh(geo, baseMat.clone());
        bubble.position.set(positions[i][0], positions[i][1], 0);
        bubble.material.color.setHex(colors[i]);

        bubble.userData.index = i;

        anchor.group.add(bubble);
        bubbles.push(bubble);
      }

      // 點擊偵測
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener("click", (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const hit = raycaster.intersectObjects(bubbles);

        if (hit.length > 0) {
          const obj = hit[0].object;
          const idx = obj.userData.index;

          showMessage(supportMessages[idx]);
          obj.material.opacity = 0; // 淡出

          clickCount++;
          tryShowQuestions();
        }
      });

      // 動畫
      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        bubbles.forEach((b, i) => {
          b.position.y += Math.sin(Date.now() * 0.001 + i) * 0.0005;
        });

        renderer.render(scene, camera);
      });
    };

    startAR();
  </script>
</body>
</html>
