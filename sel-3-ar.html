<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEL 卡片 3 ─ 情緒植物園</title>

  <!-- ThreeJS + MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.3/dist/mindar-image-three.prod.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
    }
    #mindar-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #messageBox, #questionBox {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      opacity: 0;
      transition: opacity 0.4s;
      text-align: center;
      z-index: 999;
      width: 80%;
      max-width: 420px;
      line-height: 1.5;
    }
    #messageBox { top: 10vh; }
    #questionBox { bottom: 8vh; font-size: 0.95rem; }
  </style>
</head>

<body>
  <div id="mindar-container"></div>

  <!-- 彈出訊息 -->
  <div id="messageBox"></div>

  <!-- 思考引導 -->
  <div id="questionBox">
    <b>思考引導：</b><br><br>
    ● 今天你的「情緒植物」是哪一株？為什麼？<br>
    ● 哪個情緒你最容易忽略？忽略後會怎麼影響你？<br>
    ● 想一個方法，讓你在下一次情緒來時更溫柔地對待自己？
  </div>

  <script type="module">
    const messageBox = document.getElementById("messageBox");
    const questionBox = document.getElementById("questionBox");

    // 五種情緒植物的訊息
    const plantMessages = [
      "怒：離開現場、深呼吸，讓自己冷靜一下。",
      "喜：記住這個開心時刻，它能成為你的能量。",
      "悲：悲傷不需要藏起來，可以說給信任的人聽。",
      "焦：把擔心的事寫下來，一件一件排順序。",
      "靜：平靜是身心在充電，要好好珍惜。"
    ];

    let clickCount = 0;

    function showMessage(text) {
      messageBox.innerText = text;
      messageBox.style.opacity = 1;

      setTimeout(() => {
        messageBox.style.opacity = 0;
      }, 2800);
    }

    function tryShowQuestions() {
      if (clickCount >= 3) {
        questionBox.style.opacity = 1;
      }
    }

    // 啟動 AR
    const startAR = async () => {
      const mindarThree = new window.MINDAR.IMAGE.MindARThree({
        container: document.querySelector("#mindar-container"),
        imageTargetSrc: "targets-3.mind",
      });

      const { renderer, scene, camera } = mindarThree;

      const anchor = mindarThree.addAnchor(0);

      // 光源
      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(light);

      // 五棵「情緒植物」球體
      const plants = [];
      const geometry = new THREE.ConeGeometry(0.18, 0.35, 24);
      const material = new THREE.MeshStandardMaterial({
        color: 0x88cc88,
        roughness: 0.6,
        metalness: 0.1,
      });

      // 五株植物位置
      const positions = [
        [-0.55, -0.1],   // 怒
        [-0.25, -0.1],   // 喜
        [0.05, -0.1],    // 悲
        [0.35, -0.1],    // 焦
        [0.65, -0.1],    // 靜
      ];

      for (let i = 0; i < 5; i++) {
        const plant = new THREE.Mesh(geometry, material.clone());

        plant.position.set(positions[i][0], positions[i][1], 0);
        plant.userData.index = i;

        // 顏色稍微區分
        const colors = [0xff6666, 0xffee66, 0x66aaff, 0xffbb66, 0x99dd99];
        plant.material.color.setHex(colors[i]);

        anchor.group.add(plant);
        plants.push(plant);
      }

      // 點擊偵測
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener("click", (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(plants);

        if (intersects.length > 0) {
          const obj = intersects[0].object;
          const idx = obj.userData.index;

          showMessage(plantMessages[idx]);

          // 動畫：植物長高
          obj.scale.y += 0.15;
          obj.scale.x += 0.05;

          clickCount++;
          tryShowQuestions();
        }
      });

      // 動畫 loop
      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        plants.forEach((p, i) => {
          p.rotation.y += 0.01; // 微轉動
        });

        renderer.render(scene, camera);
      });
    };

    startAR();
  </script>
</body>
</html>
